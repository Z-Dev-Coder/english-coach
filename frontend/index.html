<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="description" content="Your personal adaptive English coach." />
    <meta name="theme-color" content="#000000" />
    <title>English Coach</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script>
      // Apply the saved theme before first paint. Without this the app renders
      // light for one frame and then flashes to dark.
      (function () {
        try {
          var saved = localStorage.getItem("english-coach-theme");
          var dark = saved ? saved === "dark" : true;
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          /* private mode: fall back to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
